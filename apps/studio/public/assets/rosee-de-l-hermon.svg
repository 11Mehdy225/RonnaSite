    <text x="2" y="28" font-family="Arial, sans-serif" font-size="13" letter-spacing="7">STUDIO</text>
  </g>
  <text x="790" y="1040" fill="#d6bf92" font-family="Arial, sans-serif" font-size="17" text-anchor="end">Portrait · 5 à 10 secondes</text>
</svg>
