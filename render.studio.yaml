services:
  - type: web
    name: ronna-studio-collecte
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w @ronna/studio
    startCommand: npm run start -w @ronna/studio
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: s3
      - key: PUBLIC_BASE_URL
        value: https://ronnastudio.ronnagroup.net
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOAD_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_ACCESS_TOKEN
        generateValue: true
